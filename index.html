<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Ordena el Vuelo! 🛫</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1: #0ea5e9;
    --sky2: #38bdf8;
    --cloud: #f0f9ff;
    --sun: #fbbf24;
    --sun2: #f59e0b;
    --green: #22c55e;
    --red: #f43f5e;
    --purple: #a78bfa;
    --orange: #fb923c;
    --pink: #f472b6;
    --dark: #0f172a;
    --card-bg: #ffffff;
    --shadow: rgba(0,0,0,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(180deg, #0369a1 0%, #0ea5e9 35%, #7dd3fc 70%, #bae6fd 100%);
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* Nubes decorativas */
  .cloud-deco {
    position: fixed;
    background: white;
    border-radius: 50px;
    opacity: 0.18;
    pointer-events: none;
    filter: blur(2px);
  }
  .cloud-deco::before, .cloud-deco::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .c1 { width: 160px; height: 50px; top: 8%; left: -2%; animation: driftCloud 18s linear infinite; }
  .c1::before { width: 80px; height: 80px; top: -40px; left: 20px; }
  .c1::after { width: 60px; height: 60px; top: -30px; left: 70px; }
  .c2 { width: 200px; height: 60px; top: 20%; right: -5%; animation: driftCloud 25s linear infinite reverse; opacity: 0.12; }
  .c2::before { width: 90px; height: 90px; top: -45px; left: 30px; }
  .c2::after { width: 70px; height: 70px; top: -35px; left: 90px; }
  .c3 { width: 140px; height: 44px; top: 60%; left: 5%; animation: driftCloud 20s linear infinite; opacity: 0.1; }
  .c3::before { width: 70px; height: 70px; top: -35px; left: 15px; }

  @keyframes driftCloud {
    0% { transform: translateX(-120px); }
    100% { transform: translateX(calc(100vw + 120px)); }
  }

  /* Sol */
  .sun {
    position: fixed;
    top: -40px;
    right: 60px;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #fde68a, #fbbf24);
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(251,191,36,0.5), 0 0 120px rgba(251,191,36,0.2);
    animation: pulseSun 4s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes pulseSun {
    0%, 100% { box-shadow: 0 0 60px rgba(251,191,36,0.5), 0 0 120px rgba(251,191,36,0.2); }
    50% { box-shadow: 0 0 80px rgba(251,191,36,0.7), 0 0 160px rgba(251,191,36,0.3); }
  }

  .wrapper {
    max-width: 680px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .game-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .plane-emoji {
    font-size: 3rem;
    display: block;
    animation: planeFly 2s ease-in-out infinite;
    margin-bottom: 8px;
  }
  @keyframes planeFly {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    color: white;
    text-shadow: 0 3px 0 rgba(0,0,0,0.2);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  .subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 0.95rem;
    font-weight: 600;
  }

  /* SCOREBOARD */
  .scoreboard {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .score-chip {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 100px;
    padding: 8px 20px;
    color: white;
    font-weight: 800;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* INSTRUCCIONES */
  .instructions {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    border: 2px dashed rgba(255,255,255,0.4);
    border-radius: 20px;
    padding: 16px 20px;
    color: white;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* ZONA DE JUEGO */
  .game-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  @media (max-width: 500px) {
    .game-area { grid-template-columns: 1fr; }
  }

  .zone {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    border: 2px dashed rgba(255,255,255,0.35);
    border-radius: 20px;
    padding: 14px;
    min-height: 320px;
  }

  .zone-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    color: white;
    text-align: center;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  }

  .cards-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 260px;
  }

  /* TARJETAS */
  .phase-card {
    background: white;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: grab;
    user-select: none;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 3px 10px var(--shadow);
    border: 3px solid transparent;
    touch-action: none;
  }
  .phase-card:active { cursor: grabbing; }
  .phase-card.dragging {
    opacity: 0.5;
    transform: scale(0.95);
  }
  .phase-card.drag-over {
    border-color: var(--sky1);
    transform: scale(1.02);
  }
  .phase-card.correct-card {
    border-color: var(--green);
    background: #f0fdf4;
    animation: popIn 0.3s ease;
  }
  .phase-card.wrong-card {
    border-color: var(--red);
    background: #fff1f2;
    animation: shake 0.4s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.9); }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .card-emoji {
    font-size: 1.4rem;
    flex-shrink: 0;
  }
  .card-text {
    font-weight: 700;
    font-size: 0.88rem;
    color: #1e293b;
    line-height: 1.3;
  }
  .card-num {
    margin-left: auto;
    background: #e0f2fe;
    color: #0369a1;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .correct-card .card-num {
    opacity: 1;
    background: var(--green);
    color: white;
  }

  /* DRAG PLACEHOLDER */
  .drop-placeholder {
    height: 52px;
    border: 2px dashed rgba(255,255,255,0.5);
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
  }

  /* BOTONES */
  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .btn-check {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    background: linear-gradient(135deg, var(--green), #16a34a);
    color: white;
    border: none;
    border-radius: 100px;
    padding: 14px 36px;
    cursor: pointer;
    box-shadow: 0 4px 0 #15803d, 0 6px 20px rgba(34,197,94,0.4);
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .btn-check:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #15803d, 0 8px 24px rgba(34,197,94,0.5); }
  .btn-check:active { transform: translateY(2px); box-shadow: 0 2px 0 #15803d; }

  .btn-reset {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    background: linear-gradient(135deg, var(--orange), #ea580c);
    color: white;
    border: none;
    border-radius: 100px;
    padding: 14px 28px;
    cursor: pointer;
    box-shadow: 0 4px 0 #c2410c, 0 6px 20px rgba(251,146,60,0.4);
    transition: all 0.15s;
  }
  .btn-reset:hover { transform: translateY(-2px); }
  .btn-reset:active { transform: translateY(2px); box-shadow: 0 2px 0 #c2410c; }

  /* FEEDBACK */
  .feedback-banner {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    padding: 16px 24px;
    border-radius: 20px;
    margin-bottom: 20px;
    display: none;
    animation: slideDown 0.4s ease both;
  }
  @keyframes slideDown {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .feedback-banner.win {
    background: linear-gradient(135deg, #dcfce7, #bbf7d0);
    color: #15803d;
    border: 3px solid #86efac;
    display: block;
  }
  .feedback-banner.lose {
    background: linear-gradient(135deg, #fff1f2, #ffe4e6);
    color: #be123c;
    border: 3px solid #fda4af;
    display: block;
  }

  /* PISTA */
  .hint-section {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 20px;
  }
  .hint-toggle {
    background: none;
    border: none;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
  }
  .hint-body {
    display: none;
    margin-top: 10px;
    color: rgba(255,255,255,0.9);
    font-size: 0.85rem;
    font-weight: 600;
    line-height: 1.8;
  }
  .hint-body.show { display: block; }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 999;
    animation: confettiFall var(--dur) ease-in both;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg) translateX(var(--drift)); opacity: 0; }
  }

  /* NIVEL completado */
  .level-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--sun), var(--orange));
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 0.85rem;
    padding: 4px 14px;
    border-radius: 100px;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* Score animado */
  @keyframes scoreUp {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .score-anim { animation: scoreUp 0.4s ease; }
</style>
</head>
<body>

<div class="cloud-deco c1"></div>
<div class="cloud-deco c2"></div>
<div class="cloud-deco c3"></div>
<div class="sun"></div>

<div class="wrapper">

  <div class="game-header">
    <span class="plane-emoji">✈️</span>
    <h1>¡Ordena el Vuelo!</h1>
    <p class="subtitle">Arrastra las fases en el orden correcto del vuelo</p>
  </div>

  <div class="scoreboard">
    <div class="score-chip">⭐ Puntos: <strong id="score-display">0</strong></div>
    <div class="score-chip">🎯 Intentos: <strong id="attempts-display">0</strong></div>
    <div class="score-chip">✅ Nivel: <strong id="level-display">1</strong>/3</div>
  </div>

  <div class="feedback-banner" id="feedback-banner"></div>

  <div class="instructions" id="instructions-box">
    👇 <strong>Arrastra</strong> las tarjetas del panel izquierdo al panel derecho<br>
    y ordénalas según ocurren en un vuelo real ✈️
  </div>

  <div class="game-area">
    <div class="zone">
      <div class="zone-title">📦 Fases disponibles</div>
      <div class="cards-container" id="source-zone"></div>
    </div>
    <div class="zone">
      <div class="zone-title">🛫 Tu orden de vuelo</div>
      <div class="cards-container" id="target-zone"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-check" onclick="checkOrder()">✓ Verificar orden</button>
    <button class="btn-reset" onclick="resetLevel()">↺ Mezclar</button>
  </div>

  <div class="hint-section">
    <button class="hint-toggle" onclick="toggleHint()">
      💡 ¿Necesitas una pista? <span id="hint-arrow">▼</span>
    </button>
    <div class="hint-body" id="hint-body"></div>
  </div>

</div>

<script>
const levels = [
  {
    name: "Nivel 1 — Las Básicas",
    hint: "Recuerda: primero entran los pasajeros, luego el avión rueda, despega, sube, llega a crucero, baja, se aproxima, aterriza y vuelve a la puerta.",
    phases: [
      { text: "Embarque y puesta en marcha", emoji: "🚪", order: 1 },
      { text: "Rodaje (Taxi)", emoji: "🛞", order: 2 },
      { text: "Despegue", emoji: "🛫", order: 3 },
      { text: "Ascenso", emoji: "📈", order: 4 },
      { text: "Crucero", emoji: "☁️", order: 5 },
      { text: "Descenso", emoji: "📉", order: 6 },
      { text: "Aproximación", emoji: "🎯", order: 7 },
      { text: "Aterrizaje", emoji: "🛬", order: 8 },
      { text: "Rodaje a puerta", emoji: "🏁", order: 9 },
    ]
  },
  {
    name: "Nivel 2 — Solo las críticas",
    hint: "Las fases críticas son Despegue y Aterrizaje. Pero entre ellas va: Ascenso → Crucero → Descenso → Aproximación.",
    phases: [
      { text: "Despegue", emoji: "🛫", order: 1 },
      { text: "Ascenso inicial", emoji: "⬆️", order: 2 },
      { text: "Crucero en ruta", emoji: "✈️", order: 3 },
      { text: "Inicio de descenso", emoji: "⬇️", order: 4 },
      { text: "Aproximación final", emoji: "🎯", order: 5 },
      { text: "Toque de pista", emoji: "🛬", order: 6 },
    ]
  },
  {
    name: "Nivel 3 — Maestra del cielo 🏆",
    hint: "Piensa en lo que hace la tripulación: primero preparan la cabina, luego embarque, revisan puertas, despejan, el avión rueda, despega, asciende... ¡y tú ya sabes el resto!",
    phases: [
      { text: "Preparación de cabina", emoji: "🧹", order: 1 },
      { text: "Embarque de pasajeros", emoji: "👥", order: 2 },
      { text: "Cierre y revisión de puertas", emoji: "🔒", order: 3 },
      { text: "Pushback y puesta en marcha", emoji: "⚙️", order: 4 },
      { text: "Rodaje a pista (Taxi)", emoji: "🛞", order: 5 },
      { text: "Despegue", emoji: "🛫", order: 6 },
      { text: "Ascenso", emoji: "📈", order: 7 },
      { text: "Servicio en cabina (Crucero)", emoji: "🍽️", order: 8 },
      { text: "Preparar cabina para aterrizaje", emoji: "💺", order: 9 },
      { text: "Descenso y Aproximación", emoji: "📉", order: 10 },
      { text: "Aterrizaje", emoji: "🛬", order: 11 },
      { text: "Rodaje a puerta y desembarque", emoji: "🚶", order: 12 },
    ]
  }
];

let currentLevel = 0;
let score = 0;
let attempts = 0;
let dragSrc = null;

function getCurrentPhases() {
  return [...levels[currentLevel].phases].sort(() => Math.random() - 0.5);
}

function initLevel() {
  const shuffled = getCurrentPhases();
  const src = document.getElementById('source-zone');
  const tgt = document.getElementById('target-zone');
  src.innerHTML = '';
  tgt.innerHTML = '';

  document.getElementById('feedback-banner').className = 'feedback-banner';
  document.getElementById('instructions-box').style.display = 'block';
  document.getElementById('level-display').textContent = `${currentLevel + 1}`;
  document.getElementById('hint-body').innerHTML = levels[currentLevel].hint;
  document.getElementById('hint-body').classList.remove('show');
  document.getElementById('hint-arrow').textContent = '▼';

  shuffled.forEach(p => {
    src.appendChild(createCard(p));
  });

  // Hacer target zone droppable
  setupDropZone(src);
  setupDropZone(tgt);
}

function createCard(phase) {
  const card = document.createElement('div');
  card.className = 'phase-card';
  card.draggable = true;
  card.dataset.order = phase.order;
  card.innerHTML = `
    <span class="card-emoji">${phase.emoji}</span>
    <span class="card-text">${phase.text}</span>
    <span class="card-num">${phase.order}</span>
  `;

  // Desktop drag
  card.addEventListener('dragstart', e => {
    dragSrc = card;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    document.querySelectorAll('.drop-placeholder').forEach(p => p.remove());
  });
  card.addEventListener('dragover', e => {
    e.preventDefault();
    card.classList.add('drag-over');
  });
  card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
  card.addEventListener('drop', e => {
    e.preventDefault();
    card.classList.remove('drag-over');
    if (dragSrc && dragSrc !== card) {
      const parent = card.parentNode;
      const srcParent = dragSrc.parentNode;
      // Intercambiar o insertar antes
      const afterCard = card.nextSibling;
      parent.insertBefore(dragSrc, card);
      if (afterCard) {
        srcParent.insertBefore(card, afterCard);
      } else {
        srcParent.appendChild(card);
      }
    }
  });

  // Touch support
  let touchStartX, touchStartY, clone, origParent, origNext;
  card.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    origParent = card.parentNode;
    origNext = card.nextSibling;

    clone = card.cloneNode(true);
    clone.style.cssText = `position:fixed;z-index:1000;opacity:0.85;pointer-events:none;
      width:${card.offsetWidth}px;left:${card.getBoundingClientRect().left}px;
      top:${card.getBoundingClientRect().top}px;transform:scale(1.05);box-shadow:0 8px 24px rgba(0,0,0,0.3);`;
    document.body.appendChild(clone);
    card.style.opacity = '0.3';
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    clone.style.left = (t.clientX - card.offsetWidth / 2) + 'px';
    clone.style.top = (t.clientY - 26) + 'px';

    // Encontrar elemento debajo
    clone.style.display = 'none';
    const el = document.elementFromPoint(t.clientX, t.clientY);
    clone.style.display = '';
    const targetCard = el?.closest('.phase-card');
    document.querySelectorAll('.phase-card').forEach(c => c.classList.remove('drag-over'));
    if (targetCard && targetCard !== card) targetCard.classList.add('drag-over');
  }, { passive: false });

  card.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    clone.remove();
    card.style.opacity = '';
    document.querySelectorAll('.phase-card').forEach(c => c.classList.remove('drag-over'));

    clone.style.display = 'none';
    const el = document.elementFromPoint(t.clientX, t.clientY);

    const targetCard = el?.closest('.phase-card');
    const targetZone = el?.closest('.cards-container');

    if (targetCard && targetCard !== card) {
      targetCard.parentNode.insertBefore(card, targetCard);
    } else if (targetZone && !targetCard) {
      targetZone.appendChild(card);
    }
    // Hacer las zonas target droppables de nuevo
    setupDropZone(document.getElementById('source-zone'));
    setupDropZone(document.getElementById('target-zone'));
  });

  return card;
}

function setupDropZone(zone) {
  zone.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
  zone.addEventListener('drop', e => {
    e.preventDefault();
    if (dragSrc) {
      const target = e.target.closest('.phase-card');
      if (!target) zone.appendChild(dragSrc);
    }
  });
}

function checkOrder() {
  const targetCards = document.querySelectorAll('#target-zone .phase-card');
  attempts++;
  document.getElementById('attempts-display').textContent = attempts;

  if (targetCards.length === 0) {
    showFeedback('lose', '😅 ¡Mueve las tarjetas al panel derecho primero!');
    return;
  }

  const allPhases = levels[currentLevel].phases;
  if (targetCards.length < allPhases.length) {
    showFeedback('lose', `🤔 Faltan ${allPhases.length - targetCards.length} fases por ordenar. ¡Mueve todas al panel derecho!`);
    return;
  }

  let allCorrect = true;
  targetCards.forEach((card, idx) => {
    const expectedOrder = idx + 1;
    const actualOrder = parseInt(card.dataset.order);
    if (actualOrder === expectedOrder) {
      card.classList.remove('wrong-card');
      card.classList.add('correct-card');
    } else {
      card.classList.remove('correct-card');
      card.classList.add('wrong-card');
      allCorrect = false;
    }
  });

  if (allCorrect) {
    const pts = Math.max(10, 30 - attempts * 5 + currentLevel * 10);
    score += pts;
    document.getElementById('score-display').textContent = score;
    document.getElementById('score-display').closest('.score-chip').classList.add('score-anim');
    setTimeout(() => document.getElementById('score-display').closest('.score-chip').classList.remove('score-anim'), 400);

    launchConfetti();

    if (currentLevel < levels.length - 1) {
      showFeedback('win', `🎉 ¡Perfecto! +${pts} puntos ✨ ¡Pasas al ${levels[currentLevel + 1].name}!`);
      setTimeout(() => {
        currentLevel++;
        attempts = 0;
        initLevel();
      }, 2500);
    } else {
      showFeedback('win', `🏆 ¡Eres una maestra del vuelo! Completaste los 3 niveles con ${score} puntos. ¡Estás lista para volar! ✈️`);
    }
  } else {
    showFeedback('lose', '❌ Algunos están fuera de lugar. Las tarjetas en rojo necesitan moverse. ¡Sigue intentando!');
  }
}

function showFeedback(type, msg) {
  const banner = document.getElementById('feedback-banner');
  banner.textContent = msg;
  banner.className = `feedback-banner ${type}`;
}

function resetLevel() {
  attempts = 0;
  document.getElementById('attempts-display').textContent = 0;
  initLevel();
}

function toggleHint() {
  const body = document.getElementById('hint-body');
  const arrow = document.getElementById('hint-arrow');
  body.classList.toggle('show');
  arrow.textContent = body.classList.contains('show') ? '▲' : '▼';
}

function launchConfetti() {
  const colors = ['#fbbf24','#34d399','#60a5fa','#f472b6','#a78bfa','#fb923c','#f87171'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.cssText = `
      left: ${Math.random() * 100}vw;
      top: -10px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      --dur: ${0.8 + Math.random() * 1.5}s;
      --drift: ${(Math.random() - 0.5) * 200}px;
      width: ${6 + Math.random() * 10}px;
      height: ${6 + Math.random() * 10}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      animation-delay: ${Math.random() * 0.5}s;
    `;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3000);
  }
}

// Iniciar
initLevel();
</script>
</body>
